<style>
/* CareBridge — a calm, phone-first column. White ground, one deep-orange gradient for the main action on each screen. */
:root {
  --canvas: #F6F3F1;
  --bg: #FFFFFF;
  --soft: #F4F4F6;
  --tint: #FFF1EA;
  --tint-2: #FFD9C7;
  --ink: #1D1D1F;
  --ink-2: #63636A;
  --line: #E4E4E8;
  --accent: #C9400A;
  --accent-deep: #8F2600;
  --grad: linear-gradient(135deg, #C9400A 0%, #8F2600 100%);
  --on-accent: #FFFFFF;
  --on-accent-2: #FFE4D6;
  --good: #1E7A46;
  --good-bg: #E7F5EC;
  --warn-bg: #FFF6DB;
  --warn-ink: #7A5200;
  --danger: #B42318;
  --shadow: 0 1px 2px rgba(29, 29, 31, .06), 0 8px 24px rgba(29, 29, 31, .06);
  --font: 'Inter', 'Noto Sans SC', 'Noto Sans Devanagari', 'Noto Sans Tamil', 'Noto Sans Gurmukhi', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r-lg: 20px;
  --r-md: 16px;
  --scale: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #0B0B0C; --bg: #141416; --soft: #1F1F22; --tint: #33190D; --tint-2: #4A2311; --ink: #F4F4F6; --ink-2: #A6A6AD; --line: #2E2E33;
    --accent: #FF8A4C; --accent-deep: #FFB088; --good: #5FD08F; --good-bg: #12301F; --warn-bg: #33280A; --warn-ink: #F3C969; --danger: #FF8A80;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #0B0B0C; --bg: #141416; --soft: #1F1F22; --tint: #33190D; --tint-2: #4A2311; --ink: #F4F4F6; --ink-2: #A6A6AD; --line: #2E2E33;
  --accent: #FF8A4C; --accent-deep: #FFB088; --good: #5FD08F; --good-bg: #12301F; --warn-bg: #33280A; --warn-ink: #F3C969; --danger: #FF8A80;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}

html { font-size: calc(17px * var(--scale)); }
html.big { --scale: 1.18; }
body { background: var(--canvas); color: var(--ink); font-family: var(--font); line-height: 1.45; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }

.app {
  max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg);
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px; display: flex; flex-direction: column; gap: 22px; position: relative;
}
@media (min-width: 560px) { .app { margin-block: 24px; min-height: calc(100vh - 48px); border-radius: 32px; box-shadow: var(--shadow); padding-block: 20px 40px; } }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; color: var(--accent); font-size: .9rem; }
.icon-btn { width: 48px; height: 48px; border-radius: 24px; border: none; background: var(--soft); display: grid; place-items: center; color: var(--ink); flex-shrink: 0; }
.demo-pill { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink-2); font-size: .72rem; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
.badge-demo { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); font-size: .68rem; font-weight: 650; letter-spacing: .02em; white-space: nowrap; }

/* Type */
.h1 { font-size: 1.9rem; font-weight: 720; letter-spacing: -0.02em; line-height: 1.18; }
.h2 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
.sub { color: var(--ink-2); font-size: .95rem; }
.eyebrow { font-size: .74rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack-lg { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--ink-2); }
.small { font-size: .82rem; }
.center { text-align: center; }

/* Buttons */
.btn { min-height: 58px; border-radius: var(--r-md); border: none; padding: 0 20px; font-weight: 650; font-size: 1.02rem; display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
.btn-primary { background: var(--grad); color: var(--on-accent); box-shadow: 0 10px 24px rgba(143, 38, 0, .22); }
.btn-primary:disabled { opacity: .5; box-shadow: none; cursor: not-allowed; }
.btn-secondary { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.btn-soft { background: var(--tint); color: var(--accent); }
.btn-block { width: 100%; }
.btn-sm { min-height: 44px; font-size: .9rem; padding: 0 14px; border-radius: 12px; }
.link-btn { background: none; border: none; color: var(--accent); font-weight: 650; padding: 8px 0; text-align: left; min-height: 44px; }

/* Cards */
.card { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; background: var(--bg); }
.card-tint { background: var(--tint); border-color: transparent; }
.card-grad { background: var(--grad); color: var(--on-accent); border: none; border-radius: var(--r-lg); padding: 20px; box-shadow: 0 12px 28px rgba(143, 38, 0, .22); }
.card-grad .eyebrow, .card-grad .muted { color: var(--on-accent-2); }
.divider { height: 1px; background: var(--line); }

/* Choice tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { min-height: 72px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--bg); padding: 12px 14px; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tile[aria-pressed="true"] { background: var(--grad); color: var(--on-accent); border-color: transparent; }
.tile[aria-pressed="true"] .muted { color: var(--on-accent-2); }
.tile-name { font-size: 1.15rem; font-weight: 650; display: block; }
.check { width: 26px; height: 26px; border-radius: 13px; background: var(--on-accent); color: var(--accent-deep); display: grid; place-items: center; flex-shrink: 0; }
.list-choice { min-height: 74px; border-radius: 18px; border: 1px solid var(--line); background: var(--bg); padding: 14px 16px; display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; }
.list-choice[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--tint); }
.radio { width: 26px; height: 26px; border-radius: 13px; border: 2px solid var(--line); flex-shrink: 0; display: grid; place-items: center; }
.list-choice[aria-pressed="true"] .radio { background: var(--grad); border: none; color: #fff; }

/* Inputs */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: .82rem; font-weight: 650; color: var(--ink-2); }
.input { min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); padding: 0 16px; font-size: 1.05rem; width: 100%; }
textarea.input { padding: 14px 16px; min-height: 110px; resize: vertical; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; min-width: 52px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; font-size: .9rem; }
.chip[aria-pressed="true"], .chip[aria-checked="true"] { background: var(--accent); color: #fff; border-color: transparent; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"], :root:not([data-theme="light"]) .chip[aria-checked="true"] { background: #C9400A; } }
:root[data-theme="dark"] .chip[aria-pressed="true"], :root[data-theme="dark"] .chip[aria-checked="true"] { background: #C9400A; }

/* Progress */
.progress { display: flex; gap: 6px; }
.progress span { height: 6px; flex: 1; border-radius: 3px; background: var(--line); }
.progress span.on { background: var(--accent); }

/* Home */
.mic-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 6px 0 2px; }
.mic { width: 156px; height: 156px; border-radius: 50%; border: none; background: var(--grad); color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 14px var(--tint), 0 18px 40px rgba(143, 38, 0, .28); transition: transform .15s ease; }
.mic:active { transform: scale(.97); }
.mic.live { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 14px var(--tint), 0 0 0 14px rgba(201,64,10,.0); } 50% { box-shadow: 0 0 0 14px var(--tint), 0 0 0 26px rgba(201,64,10,.15); } }
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.quick button { min-height: 88px; border-radius: 18px; border: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: .82rem; font-weight: 650; padding: 8px 4px; text-align: center; }
.quick svg { color: var(--accent); }
.visit-row { display: flex; align-items: center; gap: 14px; padding: 14px 0; border: none; background: none; width: 100%; text-align: left; border-bottom: 1px solid var(--line); min-height: 64px; }
.visit-row:last-child { border-bottom: none; }
.date-tile { width: 52px; flex-shrink: 0; border-radius: 12px; background: var(--tint); color: var(--accent); text-align: center; padding: 6px 0; line-height: 1.1; }
.date-tile b { display: block; font-size: 1.25rem; }
.date-tile span { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--ink-2); white-space: nowrap; }
.status.ok { background: var(--good-bg); color: var(--good); }
.status.wait { background: var(--warn-bg); color: var(--warn-ink); }

/* Chart */
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 112px minmax(0, 1fr) 28px; align-items: center; gap: 10px; font-size: .92rem; }
.bar-track { height: 14px; border-radius: 7px; background: var(--soft); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 7px; background: var(--grad); }
.bar-fill.grey { background: var(--line); }
.bar-num { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.months { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; align-items: end; height: 64px; padding-top: 6px; }
.month { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.month .dots { display: flex; flex-direction: column-reverse; gap: 4px; align-items: center; }
.month .dot { width: 22px; height: 14px; border-radius: 4px; background: var(--grad); }
.month .dot.grey { background: var(--line); }
.month small { font-size: .7rem; color: var(--ink-2); font-weight: 600; }

/* Chat */
.chat { display: flex; flex-direction: column; gap: 12px; flex: 1; }
.bubble { max-width: 86%; padding: 13px 16px; border-radius: 22px; font-size: 1.05rem; line-height: 1.45; white-space: pre-wrap; }
.bubble.ai { align-self: flex-start; background: var(--soft); border-bottom-left-radius: 6px; }
.bubble.me { align-self: flex-end; background: var(--grad); color: #fff; border-bottom-right-radius: 6px; }
.bubble.alert { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--line); font-weight: 600; }
.confirm { border: 2px solid var(--accent); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px; align-self: stretch; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; font-size: 1.02rem; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-weight: 650; text-align: right; }
.composer { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 24px; background: var(--tint); position: sticky; bottom: 12px; }
.composer .input { min-height: 52px; border: none; background: var(--bg); }
.composer .mic-sm { width: 56px; height: 56px; border-radius: 28px; border: none; background: var(--grad); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
.composer .mic-sm.live { animation: pulse 1.4s ease-in-out infinite; }
.wave { display: flex; gap: 4px; align-items: center; height: 30px; }
.wave i { width: 4px; border-radius: 2px; background: var(--accent); animation: wave 1s ease-in-out infinite; }
@keyframes wave { 0%, 100% { height: 8px; } 50% { height: 28px; } }

/* Call transcript */
.transcript { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.line { display: flex; flex-direction: column; gap: 3px; animation: rise .35s ease both; }
.line .who { font-size: .7rem; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.line.ai .who { color: var(--accent); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.typing { display: flex; gap: 5px; padding: 4px 0; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-2); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.live-dot { width: 10px; height: 10px; border-radius: 5px; background: var(--accent); box-shadow: 0 0 0 4px var(--tint-2); }

/* Timeline */
.tl { display: flex; flex-direction: column; }
.tl-item { display: flex; gap: 14px; }
.tl-rail { display: flex; flex-direction: column; align-items: center; width: 16px; }
.tl-dot { width: 16px; height: 16px; border-radius: 8px; background: var(--accent); margin-top: 4px; flex-shrink: 0; }
.tl-dot.open { background: none; border: 2px solid var(--accent); }
.tl-line { width: 2px; flex: 1; background: var(--line); min-height: 18px; }
.tl-body { padding-bottom: 18px; }

/* Avatars */
.avatars { display: flex; gap: 14px; flex-wrap: wrap; }
.av { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .82rem; min-width: 56px; }
.av-c { width: 48px; height: 48px; border-radius: 24px; background: var(--soft); color: var(--ink); display: grid; place-items: center; font-weight: 750; font-size: 1.05rem; }
.av-c.on { background: var(--grad); color: #fff; }

/* Notification preview */
.notif-layer { position: fixed; left: 0; right: 0; top: calc(10px + env(safe-area-inset-top, 0px)); display: flex; justify-content: center; pointer-events: none; z-index: 50; padding: 0 12px; }
.notif { pointer-events: auto; width: min(440px, 100%); background: rgba(250, 250, 252, .97); color: #1D1D1F; border-radius: 22px; padding: 12px 14px; box-shadow: 0 14px 40px rgba(0,0,0,.18); display: flex; gap: 12px; align-items: flex-start; border: 1px solid rgba(0,0,0,.06); animation: drop .35s ease both; }
@keyframes drop { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
.notif .app-ic { width: 38px; height: 38px; border-radius: 10px; background: var(--grad); display: grid; place-items: center; color: #fff; flex-shrink: 0; }
.notif .n-head { display: flex; justify-content: space-between; gap: 8px; font-size: .72rem; color: #6E6E73; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.notif b { font-size: .95rem; display: block; }
.notif p { font-size: .9rem; color: #3A3A3C; }

/* Sheets and toasts */
.sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: min(480px, 100%); max-height: 88vh; overflow-y: auto; background: var(--bg); border-radius: 26px 26px 0 0; padding: 20px max(20px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; animation: up .25s ease both; }
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); background: #1D1D1F; color: #fff; padding: 12px 18px; border-radius: 14px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.switch { width: 52px; height: 32px; border-radius: 16px; background: var(--line); border: none; position: relative; flex-shrink: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 13px; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch[aria-checked="true"] { background: #C9400A; }
.switch[aria-checked="true"]::after { left: 23px; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); min-height: 60px; }
.portal { border-radius: var(--r-lg); border: 1px solid var(--line); overflow: hidden; }
.portal-head { background: var(--soft); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.portal-body { padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--tint-2); border-top-color: var(--accent); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tag { display: inline-block; padding: 2px 8px; border-radius: 6px; background: var(--soft); font-size: .74rem; font-weight: 650; color: var(--ink-2); }
code { font-size: .85em; background: var(--soft); padding: 1px 5px; border-radius: 5px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
@media (max-width: 380px) { .quick { grid-template-columns: repeat(2, minmax(0, 1fr)); } .h1 { font-size: 1.65rem; } }

.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.row > svg { flex-shrink: 0; }

.rec-dot { width: 12px; height: 12px; border-radius: 6px; background: #D92D20; animation: recpulse 1s ease-in-out infinite; }
@keyframes recpulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .rec-dot { animation: none; } }

</style>

/* ---------- Dates ---------- */
function atTime(daysFromToday, hh, mm) {
  const d = new Date(); d.setHours(hh, mm || 0, 0, 0); d.setDate(d.getDate() + daysFromToday); return d.toISOString();
}
function fmtDay(iso, lang) { return new Intl.DateTimeFormat(langInfo(lang).locale, { weekday: 'short', month: 'short', day: 'numeric' }).format(new Date(iso)); }
function fmtLongDay(iso, lang) { return new Intl.DateTimeFormat(langInfo(lang).locale, { weekday: 'long', month: 'long', day: 'numeric' }).format(new Date(iso)); }
function fmtTime(iso, lang) { return new Intl.DateTimeFormat(langInfo(lang).locale, { hour: 'numeric', minute: '2-digit' }).format(new Date(iso)); }
function fmtMonthShort(d, lang) { return new Intl.DateTimeFormat(langInfo(lang).locale, { month: 'short' }).format(d); }
function fmtDayNum(iso, lang) { return new Intl.DateTimeFormat(langInfo(lang).locale, { day: 'numeric' }).format(new Date(iso)); }
function fmtWeekdayShort(dayIndex, lang) { const d = new Date(2024, 0, 7 + dayIndex); return new Intl.DateTimeFormat(langInfo(lang).locale, { weekday: 'short' }).format(d); }
function sameDay(a, b) { const x = new Date(a), y = new Date(b); return x.toDateString() === y.toDateString(); }
function isUpcoming(a) { return a.status === 'booked' && new Date(a.start).getTime() > Date.now() - 3 * 3600000; }
function pickupTime(a) { return new Date(new Date(a.start).getTime() - 40 * 60000 + (a.delayMin || 0) * 60000).toISOString(); }
function visitTime(a) { return new Date(new Date(a.start).getTime() + (a.delayMin || 0) * 60000).toISOString(); }

}
function loadState() {
  try { const raw = localStorage.getItem(CONFIG.STORAGE_KEY); if (raw) { const s = JSON.parse(raw); if (s && s.v === 1) return Object.assign(blankState(), s); } } catch (e) { /* storage blocked: run in memory */ }
  return blankState();
}
function saveState(s) { try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(s)); } catch (e) { /* ignore */ } }
function clearState() { try { localStorage.removeItem(CONFIG.STORAGE_KEY); } catch (e) { /* ignore */ } }

function mapPatient(p, meds) {
  if (!p) return null;
  const n = (p.name || [])[0] || {};

  const ids = p.identifier || [];

  const lang = (((p.communication || [])[0] || {}).language || {}).coding?.[0]?.code || null;

    fullName, birthDate: p.birthDate || null, mrn: mrnId ? mrnId.value : null, language: lang,

function mapAppointment(r) {

  const doc = actor(/^Practitioner/).display || (parts.find((x) => x.actor && x.actor.display && !/^Patient|^Location/.test(x.actor.reference || '')) || {}).actor?.display || 'Your doctor';
  const loc = actor(/^Location/).display || '';

    status: (() => { const s = statusMap[r.status] || 'booked'; return s === 'booked' && r.start && new Date(r.start).getTime() < Date.now() - DAY ? 'done' : s; })(),
    ride: { status: 'idle', driverId: null, askedId: null, declinedIds: [] }, delayMin: 0, followUp: null

    resourceType: 'Appointment', id: 'enc-' + e.id, status: e.status === 'finished' ? 'fulfilled' : 'booked',
    start: (e.period && e.period.start) || new Date().toISOString(),
    description: (e.type && e.type[0] && (e.type[0].text || (e.type[0].coding || [])[0]?.display)) || (e.reasonCode && e.reasonCode[0] && e.reasonCode[0].text) || 'Visit',
    participant: [
      { actor: { reference: 'Practitioner/x', display: who ? who.individual.display : 'Clinic visit' } },
      { actor: { reference: 'Location/x', display: (where && where.location && where.location.display) || (e.serviceProvider && e.serviceProvider.display) || '' } }
    ]

/* Merge freshly synced visits into state; report changes the family should hear about. */
function mergeSync(state, fresh) {
  const changes = [];
  const byId = Object.fromEntries(state.appts.map((a) => [a.id, a]));
  for (const f of fresh) {
    const old = byId[f.id];
    if (!old) { state.appts.push(f); continue; }
    if (old.status === 'booked' && f.status === 'cancelled') changes.push({ kind: 'cancelled', appt: old });
    else if (old.status === 'booked' && f.status === 'booked' && old.start !== f.start) changes.push({ kind: 'moved', appt: old, to: f.start });
    old.start = f.start; old.doctor = f.doctor; old.place = f.place || old.place;
    if (!(old.status === 'done' && f.status === 'booked')) old.status = f.status;
  }
  state.appts.sort((a, b) => new Date(a.start) - new Date(b.start));

/* ---------- Real SMART on FHIR sign-in (standalone patient launch, PKCE) ---------- */

  sessionStorage.setItem('cb.smart', JSON.stringify({ serverId, verifier, state: st, token_endpoint: conf.token_endpoint, clientId: srv.clientId() }));

  let appts = [], meds = [];
  try {
    const b = await fhirGet(srv.iss, 'Appointment?patient=' + encodeURIComponent(patientId) + srv.apptQuery, token);
    appts = (b.entry || []).map((e) => e.resource).filter((r) => r && r.resourceType === 'Appointment');
  } catch (e) { console.warn(e); }

    try {
      const b = await fhirGet(srv.iss, 'Encounter?patient=' + encodeURIComponent(patientId) + '&_sort=-date&_count=12', token);

  }

    const b = await fhirGet(srv.iss, 'MedicationRequest?patient=' + encodeURIComponent(patientId), token);
    meds = (b.entry || []).map((e) => e.resource).filter((r) => r && r.resourceType === 'MedicationRequest');

  if (!code && !err) return null;
  history.replaceState(null, '', location.pathname);
  if (err) return { error: params.get('error_description') || err };
  let saved; try { saved = JSON.parse(sessionStorage.getItem('cb.smart') || 'null'); } catch (e) { saved = null; }
  if (!saved || saved.state !== st) return { error: 'The sign-in could not be matched. Please try again.' };

/* ---------- Ride matching ---------- */

// then whoever has driven least. A "no" is recorded silently and the next person is asked.

const LEGS = ['to', 'back'];

}

  if (!pool.length) return null;
  const when = legTime(appt, leg);

  if (!c) { appt[k] = Object.assign(appt[k], { status: 'none', askedId: null, driverId: null }); return null; }
  appt[k] = Object.assign(appt[k], { status: 'asking', askedId: c.id, driverId: null, askedAt: Date.now(), outside: !fitsTime(c, legTime(appt, leg)) });

  const s = addSeries(state, { what: t(state.profile.lang, 'physio'), place: 'Valley Physical Therapy, 2100 Forest Ave, San Jose', weekday: 4, time: '16:00', durationMin: 60, standing: { to: id('Avi'), back: null } });
  s.demo = true;
  const backs = [id('Krish'), id('Mini'), id('Krish')];
  for (let w = 1; w <= 3; w++) {
    const day = new Date(); day.setHours(0, 0, 0, 0);
    const offset = (day.getDay() - 4 + 7) % 7 || 7;
    const past = new Date(day.getTime() - (offset + (w - 1) * 7) * DAY);
    const occ = occurrenceFor(s, past);
    occ.status = 'done';
    occ.ride = Object.assign(blankRide(), { status: 'confirmed', driverId: id('Avi'), standing: true });
    occ.rideBack = Object.assign(blankRide(), { status: 'confirmed', driverId: backs[w - 1] });
    if (!state.appts.some((a) => a.id === occ.id)) state.appts.push(occ);
  }
  state.appts.sort((x, y) => new Date(x.start) - new Date(y.start));

  const first = state.appts.find((a) => a.seriesId === s.id && isUpcoming(a));
  if (first && first.rideBack.status === 'idle') askNext(state, first, 'back');
  return s;
}

/* Understand "physio every Thursday at 2, about an hour" in any of the 7 languages (offline fallback). */
const WEEKDAY_WORDS = [

const WEEKLY_WORDS = /every|each|weekly|a week|हर|हफ़्ते|हफ्ते|每|ஒவ்வொரு|வாரம்|ਹਰ|ਹਫ਼ਤੇ|cada|todos los|semanal|mỗi|hàng tuần|thursdays|mondays|tuesdays|wednesdays|fridays|saturdays|sundays/;
function parseWeekly(text) {
  const s = String(text || '').toLowerCase();
  let weekday = null;
  WEEKDAY_WORDS.forEach((words, i) => { if (weekday === null && words.some((w) => s.includes(w))) weekday = i; });
  if (weekday === null || !WEEKLY_WORDS.test(s)) return null;
  let time = null;
  const m = Array.from(s.matchAll(/(\d{1,3})(?:[:.](\d{2}))?\s*(am|pm|a\.m\.|p\.m\.|बजे|点|giờ|மணி|ਵਜੇ|min|minute|मिनट|分钟|phút|நிமிட|ਮਿੰਟ|hour|घंटा|小时|tiếng)?/g))

  if (m) {
    let h = Number(m[1]); const ap = (m[3] || '').replace(/\./g, '');
    if (ap === 'pm' && h < 12) h += 12; else if (ap === 'am' && h === 12) h = 0; else if (!ap.match(/am|pm/) && h >= 1 && h <= 6) h += 12;
    time = String(h).padStart(2, '0') + ':' + (m[2] || '00');
  }
  let durationMin = 60;
  const dm = s.match(/(\d{2,3})\s*(min|minutes|मिनट|分钟|phút|நிமிட|ਮਿੰਟ)/);
  if (dm) durationMin = Number(dm[1]);
  else if (/half an hour|आधा घंटा|半小时|media hora|nửa tiếng/.test(s)) durationMin = 30;
  else if (/hour and a half|90|डेढ़|一个半/.test(s)) durationMin = 90;
  let what = null;
  if (/physio|physical therapy|therapy|फिज़ियो|फिजियो|理疗|物理治疗|பிசியோ|ਫਿਜ਼ੀਓ|fisioterapia|vật lý trị liệu/.test(s)) what = 'physio';

  const pm = String(text).match(/\bat ((?:[A-Z][\w'&.-]*\s?){1,5})/);
  const place = pm ? pm[1].trim() : '';
  return { weekday, time: time || '14:00', durationMin, what, place };
}

/* ---------- Booking a new visit ---------- */
function nextSlot(state, timePref) {
  const hour = timePref === 'afternoon' ? 14 : 10;
  for (let d = 3; d < 30; d++) {
    const iso = atTime(d, hour, 0); const day = new Date(iso).getDay();
    if (day === 0 || day === 6) continue;
    if (state.appts.some((a) => a.status === 'booked' && sameDay(a.start, iso))) continue;
    return iso;
  }
  return atTime(7, hour, 0);
}

/* ---------- Reminders ---------- */
function computeReminders(state) {
  const L = state.profile.lang, out = [], now = Date.now();
  for (const a of state.appts) {
    if (isUpcoming(a)) {
      const start = new Date(visitTime(a)).getTime();
      const driver = state.people.find((p) => p.id === a.ride.driverId);
      const back = a.rideBack && state.people.find((p) => p.id === a.rideBack.driverId);
      const extra = [driver ? t(L, 'remPickup', { name: driver.name, pickup: fmtTime(pickupTime(a), L) }) : '', back ? t(L, 'bringsYou', { name: back.name }) + ' · ' + fmtTime(endTime(a), L) : '', (a.prep || [])[0] || ''].filter(Boolean).join(' · ');
      if (sameDay(start, now)) out.push({ id: a.id + '-dayof', apptId: a.id, when: start - 2 * 3600000, title: t(L, 'remDayOf', { time: fmtTime(visitTime(a), L), doctor: a.doctor }), body: extra });
      else out.push({ id: a.id + '-before', apptId: a.id, when: start - DAY, title: t(L, 'remDayBefore', { time: fmtTime(visitTime(a), L), doctor: a.doctor }), body: extra, date: fmtDay(a.start, L) });
    }
    if (a.status === 'done' && a.followUp && a.followUp.months) {
      out.push({ id: a.id + '-fu', apptId: a.id, when: new Date(a.start).getTime() + (a.followUp.months * 30 - 14) * DAY, title: t(L, 'remFollow', { doctor: a.doctor }), body: '', follow: true });
    }
  }
  return out.sort((x, y) => x.when - y.when);
}

/* ---------- Understanding what the senior asks for ---------- */
function fallbackUnderstand(text) {
  const s = (text || '').toLowerCase();
  if (URGENT_WORDS.some((w) => s.includes(w))) return { intent: 'emergency' };
  let specialty = null;
  for (const sp of ['ortho', 'cardio', 'eye', 'skin', 'family']) if (KEYWORDS[sp].some((w) => s.includes(w.toLowerCase()))) { specialty = sp; break; }

// When the app is hosted on Vercel with the /api functions, it uses them for AI on the website,

let serverPromise = null;
function getServer() {

      .then((r) => (r.ok ? r.json() : null)).then((j) => (j && j.ok ? j : null)).catch(() => null);

async function api(path, body, method) {

/* Turn a photo or a recording into a data URL ("data:audio/webm;base64,...") so it can travel as text. */
function fileToDataUrl(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result));
    reader.readAsDataURL(file);
  });
}

/* ---------- AI: Claude, through our server ---------- */
// Ask Claude for a JSON answer. Returns null when the server has no AI or something fails;
// every caller then falls back to simple keyword matching, so the app still works.
async function aiJSON(prompt, image) {
  const srv = await getServer();
  if (!srv || !srv.features.ai) return null;
  try {
    const body = { prompt };
    if (image) {
      // Images travel as base64 text inside the JSON body.
      const dataUrl = await fileToDataUrl(image);
      body.images = [{ media_type: image.type || 'image/jpeg', data: dataUrl.split(',')[1] }];
    }
    const j = await api('ai', body);
    return j.json || null;
  } catch (e) {
    console.warn(e);
    return null;
  }
}

/* ---------- Reading an appointment letter, text message or photo ---------- */
const LETTER_FIELDS = ['doctor', 'clinic', 'address', 'reason', 'date', 'time', 'phone'];
function letterPrompt(state, text) {

    'Rules: copy names, addresses and phone numbers exactly as written. Work out relative dates ("next Tuesday") from the date of the message if it has one, otherwise from today.',
    'Never guess a missing date or time: use null. "prep" lists short preparation steps written in the letter (arrive early, fasting, what to bring), each translated into ' + li.english + ', at most 5.',
    '"reason" is 2 to 6 words in ' + li.english + '. "unsure" lists the field names you are not confident about (blurry, ambiguous, handwritten).',

const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12 };
/* No-AI fallback: pull out what simple patterns can find; the person fills in the rest. */
function parseLetterFallback(text) {
  const s = text || '';
  const out = { isAppointment: false, doctor: null, clinic: null, address: null, reason: null, date: null, time: null, phone: null, prep: [], interpreter: null, unsure: [] };
  const pad = (n) => String(n).padStart(2, '0');
  const now = new Date();
  const fixYear = (m, d, y) => { let yr = y ? (String(y).length === 2 ? 2000 + Number(y) : Number(y)) : now.getFullYear(); const dt = new Date(yr, m - 1, d); if (!y && dt.getTime() < now.getTime() - 30 * DAY) yr += 1; return yr + '-' + pad(m) + '-' + pad(d); };
  let m;
  if ((m = s.match(/\b(20\d\d)-(\d{1,2})-(\d{1,2})\b/))) out.date = m[1] + '-' + pad(m[2]) + '-' + pad(m[3]);
  else if ((m = s.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))) out.date = fixYear(Number(m[1]), Number(m[2]), m[3]);
  else if ((m = s.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(20\d\d))?/i))) out.date = fixYear(MONTHS[m[1].toLowerCase()], Number(m[2]), m[3]);
  else if ((m = s.match(/\b(\d{1,2})\s+(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?(?:,?\s+(20\d\d))?/i))) out.date = fixYear(MONTHS[m[2].toLowerCase()], Number(m[1]), m[3]);
  if ((m = s.match(/\b(\d{1,2})(?::(\d{2}))?\s*([ap])\.?\s?m\.?\b/i))) { let h = Number(m[1]) % 12; if (m[3].toLowerCase() === 'p') h += 12; out.time = pad(h) + ':' + (m[2] || '00'); }
  else if ((m = s.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/))) out.time = pad(m[1]) + ':' + m[2];
  if ((m = s.match(/\bDr\.?[ \t]+[A-Z][\w.'-]+(?:[ \t]+[A-Z][\w.'-]+){0,2}/))) out.doctor = m[0].replace(/^Dr\.?\s*/, 'Dr. ');
  const first = s.split('\n').map((x) => x.trim()).find((x) => x && !/\d/.test(x) && !/^dr\b/i.test(x) && x.length < 60);
  if (first && /clinic|center|centre|hospital|medical|health|ortho|orthopedics|dental|eye|lab|associates|group/i.test(first)) out.clinic = first;
  if ((m = s.match(/\(?\b\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}\b/))) out.phone = m[0];
  if ((m = s.match(/\d{2,5}\s+[A-Z][\w.]*(?:\s+[A-Z][\w.]*){0,4}\s+(?:St|Street|Ave|Avenue|Rd|Road|Blvd|Dr|Drive|Way|Ln|Lane|Ct|Pkwy)\.?(?:[^\n]{0,40})?/))) out.address = m[0].trim();
  out.prep = s.split(/\n|(?<=\.)\s+/).map((x) => x.trim()).filter((x) => /\b(arrive|bring|fast|do not eat|don't eat|no food|wear|check in|check-in)\b/i.test(x)).slice(0, 4);
  if ((m = s.match(/(?:reason|visit type|appointment type)[:\s]+([^\n.]{3,40})/i)) && !/^(purna|questions)/i.test(m[1])) out.reason = m[1].trim();
  out.isAppointment = !!(out.date || out.time || out.doctor);
  return out;
}
/* Returns { via: 'ai'|'fallback'|'none', fields } where fields matches the JSON shape above. */
async function readLetter(state, { text, image }) {
  const j = await aiJSON(letterPrompt(state, text), image);
  if (j && typeof j === 'object') {
    const f = Object.assign({ isAppointment: true, prep: [], unsure: [] }, j);
    f.prep = Array.isArray(f.prep) ? f.prep.filter(Boolean).slice(0, 5) : [];
    f.unsure = Array.isArray(f.unsure) ? f.unsure.filter((x) => LETTER_FIELDS.includes(x)) : [];
    if (f.date && !/^\d{4}-\d{2}-\d{2}$/.test(f.date)) { f.unsure.push('date'); f.date = null; }
    if (f.time && !/^\d{1,2}:\d{2}$/.test(f.time)) { f.unsure.push('time'); f.time = null; }
    return { via: 'ai', fields: f };
  }
  if (image && !text) return { via: 'none', fields: parseLetterFallback('') };
  return { via: 'fallback', fields: parseLetterFallback(text) };
}
/* Shrink a photo before reading it: phones take 12-megapixel pictures; 1600 px is plenty for text. */
function shrinkImage(file, max = 1600) {
  return new Promise((resolve) => {
    try {
      const url = URL.createObjectURL(file); const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob((b) => resolve(b || file), 'image/jpeg', 0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    } catch (e) { resolve(file); }
  });
}

/* ---------- Voice ---------- */
function speak(text, lang) {
  try {
    if (!('speechSynthesis' in window)) return false;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); const loc = langInfo(lang).locale; u.lang = loc; u.rate = 0.92;
    const v = window.speechSynthesis.getVoices().find((x) => x.lang && x.lang.toLowerCase().startsWith(loc.slice(0, 2).toLowerCase()));
    if (v) u.voice = v;
    window.speechSynthesis.speak(u); return true;
  } catch (e) { return false; }
}
function startListening(lang, onText, onEnd) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  try {
    const r = new SR(); r.lang = langInfo(lang).locale; r.interimResults = true; r.continuous = false;
    r.onresult = (e) => { let s = ''; for (let i = 0; i < e.results.length; i++) s += e.results[i][0].transcript; onText(s, e.results[e.results.length - 1].isFinal); };
    r.onerror = (e) => onEnd(e.error || 'error');
    r.onend = () => onEnd(null);
    r.start(); return r;
  } catch (e) { return null; }
}

function rideRequestText(state, a, leg = 'to') {

function skipText(state, a) { return 'CareBridge: no ' + (a.reason || 'visit') + ' on ' + fmtDay(a.start, 'en') + ' this week, so no ride is needed. Thank you!'; }

async function sendText(person, body, extra) {
  if (!person || !person.phone) return false;

  if (!srv || !srv.features.sms) return false;

/* ---------- Push notifications (installable website version) ---------- */
function urlB64ToUint8(b64) { const pad = '='.repeat((4 - (b64.length % 4)) % 4); const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, (c) => c.charCodeAt(0)); }
async function enablePush() {
  const srv = await getServer();
  if (!srv || !srv.features.push || !srv.vapidPublicKey) throw new Error('Push is not set up on the server yet.');
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) throw new Error('This browser cannot receive notifications. On iPhone, add CareBridge to the Home Screen first.');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('Notifications were not allowed.');
  const reg = await navigator.serviceWorker.register('/sw.js');
  await navigator.serviceWorker.ready;
  const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8(srv.vapidPublicKey) }));
  const j = await api('push/subscribe', { subscription: sub.toJSON() });
  return j.id;
}
async function pushNow(pushId, title, body) { if (!pushId) return; try { await api('push/send', { id: pushId, title, body }); } catch (e) { console.warn(e); } }
async function pushSchedule(state) {
  const id = state.settings.pushId; if (!id) return;
  const items = computeReminders(state).filter((r) => r.when > Date.now()).map((r) => ({ key: r.id, at: r.when, title: r.title, body: r.body || '' }));
  try { await api('push/schedule', { id, items }); } catch (e) { console.warn(e); }
}

function StepCircle({ st, update, next }) {
  const L = st.profile.lang;
  const finish = () => {
    update((n) => {
      // Demo history: who drove to past visits (the real portal does not know this).
      if (n.hospital && n.hospital.mode === 'demo' && n.people.length) {
        let i = 0; n.appts.filter((a) => a.status === 'done' && !a.ride.driverId).forEach((a) => { a.ride.driverId = n.people[i % n.people.length].id; a.ride.status = 'confirmed'; i++; });
      }
      // Ask the circle about visits the hospital already has on the calendar.
      n.appts.filter((a) => isUpcoming(a) && !a.seriesId).forEach((a) => {
        if (a.ride.status === 'idle' || a.ride.status === 'none') {
          const c = askNext(n, a);
          if (c && n.hospital && n.hospital.mode === 'demo') acceptRide(n, a.id, c.id); // demo: the family already said yes
        }
      });
    });
    next();
  };
  return html`<div className="stack-lg" style=${{ flex: 1 }}>
    <div className="stack"><h1 className="h1">${t(L, 'circleTitle')}</h1><p className="sub">${t(L, 'circleSub')}</p></div>

      <button className="btn btn-primary btn-block" onClick=${finish}>${t(L, 'continue')}</button>
      ${!st.people.length ? html`<button className="btn btn-secondary btn-block" onClick=${finish}>${t(L, 'skip')}</button>` : null}
    </div>
  </div>`;
}

/* Past visits: bars by who drove, plus the last six months at a glance. */
function PastVisits({ st }) {
  const L = st.profile.lang;
  const past = st.appts.filter((a) => a.status === 'done').sort((a, b) => new Date(b.start) - new Date(a.start));
  if (!past.length) return null;
  const counts = {};
  // Every ride counts: a weekly visit with a ride there and a ride home gives two.
  past.forEach((a) => {
    const ids = legsOf(a).map((l) => a[legKey(l)] && a[legKey(l)].driverId).filter((id) => id && st.people.some((p) => p.id === id));
    if (!ids.length) counts._none = (counts._none || 0) + 1;
    ids.forEach((k) => { counts[k] = (counts[k] || 0) + 1; });
  });
  const rows = Object.entries(counts).map(([k, n]) => ({ k, n, name: k === '_none' ? t(L, 'notRecorded') : st.people.find((p) => p.id === k).name })).sort((a, b) => (a.k === '_none') - (b.k === '_none') || b.n - a.n);
  const max = Math.max(...rows.map((r) => r.n));
  const months = Array.from({ length: 6 }, (_, i) => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - (5 - i)); return d; });
  return html`<div className="card stack-lg">
    <div className="row" style=${{ justifyContent: 'space-between' }}>
      <div><span className="eyebrow">${t(L, 'past')}</span><div className="h2">${t(L, 'pastSub')}</div></div>
      <span className="status">${t(L, 'visitsN', { n: past.length })}</span>
    </div>
    <div className="bars" role="img" aria-label=${rows.map((r) => r.name + ' ' + r.n).join(', ')}>
      ${rows.map((r) => html`<div key=${r.k} className="bar-row">
        <span style=${{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>${r.name}</span>
        <div className="bar-track"><div className=${'bar-fill' + (r.k === '_none' ? ' grey' : '')} style=${{ width: (r.n / max * 100) + '%' }}></div></div>
        <span className="bar-num">${r.n}</span>
      </div>`)}
    </div>
    <div>
      <div className="months" aria-hidden="true">
        ${months.map((m, i) => {
          const inMonth = past.filter((a) => new Date(a.start).getMonth() === m.getMonth() && new Date(a.start).getFullYear() === m.getFullYear());
          return html`<div key=${i} className="month">
            <div className="dots">${inMonth.map((a) => html`<span key=${a.id} className=${a.ride && a.ride.driverId ? 'dot' : 'dot grey'} title=${a.doctor}></span>`)}</div>
            <small>${fmtMonthShort(m, L)}</small>
          </div>`;
        })}
      </div>
    </div>
    <div className="stack" style=${{ gap: 0 }}>
      ${past.slice(0, 3).map((a) => { const names = Array.from(new Set(legsOf(a).map((l) => st.people.find((p) => p.id === (a[legKey(l)] && a[legKey(l)].driverId))).filter(Boolean).map((p) => p.name))); return html`<div key=${a.id} className="visit-row" style=${{ cursor: 'default' }}>
        <${DateTile} iso=${a.start} lang=${L} />
        <div className="grow"><b style=${{ display: 'block' }}>${a.seriesId ? a.reason : a.doctor}</b><span className="muted small clamp2">${a.seriesId ? a.place.split(',')[0] : a.reason}</span></div>
        ${names.length ? html`<span className="status ok"><${Icon} name="car" size=${14} />${names.join(' · ')}</span>` : null}
      </div>`; })}
    </div>
  </div>`;
}

/* =====================================================================
   TALK (book by voice or typing)
   ===================================================================== */
function Talk({ st, update, go, listen }) {
  const L = st.profile.lang;
  const [msgs, setMsgs] = useState([{ role: 'assistant', text: t(L, 'hello', { name: st.profile.name }) }]);
  const [draft, setDraft] = useState(null);
  const [wk, setWk] = useState(null); // a weekly visit heard in the conversation (v1.2)
  const [text, setText] = useState('');
  const [busy, setBusy] = useState(false);
  const [live, setLive] = useState(false);
  const [micMsg, setMicMsg] = useState('');
  const recRef = useRef(null);
  const endRef = useRef(null);
  useEffect(() => { endRef.current && endRef.current.scrollIntoView({ block: 'end', behavior: 'smooth' }); }, [msgs, draft, busy]);
  useEffect(() => { if (listen) startMic(); return () => { try { recRef.current && recRef.current.abort(); } catch (e) { } }; }, []);

  const startMic = () => {
    if (live) { try { recRef.current && recRef.current.stop(); } catch (e) { } return; }
    setMicMsg('');
    const r = startListening(L, (s, final) => { setText(s); if (final) { setLive(false); send(s); } }, (err) => { setLive(false); if (err && err !== 'no-speech' && err !== 'aborted') setMicMsg(t(L, 'micOff')); });
    if (!r) { setMicMsg(t(L, 'micOff')); return; }
    recRef.current = r; setLive(true);
  };

  const send = async (raw) => {
    const s = (raw != null ? raw : text).trim();
    if (!s || busy) return;
    setText(''); setDraft(null); setWk(null);
    const history = [...msgs, { role: 'user', text: s }];
    setMsgs(history); setBusy(true);
    const quick = parseWeekly(history.filter((m) => m.role === 'user').slice(-2).map((m) => m.text).join(' '));
    const res = await understand(st, history);
    setBusy(false);
    if (res.intent === 'emergency') { setMsgs((m) => [...m, { role: 'assistant', text: res.reply || t(L, 'emergency'), alert: true }]); return; }
    const weekly = (res.via === 'ai' && res.weekly) || quick;
    if (weekly) {
      const what = weekly.what === 'physio' || weekly.what === 'dialysis' ? t(L, weekly.what) : (weekly.what || (quick && quick.what ? t(L, quick.what) : ''));
      setWk({ what, weekday: weekly.weekday, time: weekly.time, durationMin: weekly.durationMin || 60, place: weekly.place || (quick && quick.place) || '' });
      setMsgs((m) => [...m, { role: 'assistant', text: t(L, 'wkHeard') }]);
      return;
    }
    const ready = res.via === 'ai' ? res.ready : !!res.specialty;
    if (ready && res.specialty) {
      const doc = doctorFor(st, res.specialty);
      setDraft({ specialty: res.specialty, doctor: doc.doctor, place: doc.place, clinic: doc.clinic, reason: res.reason || t(L, 'rs_' + res.specialty), reasonEn: res.reasonEn || REASON_EN[res.specialty], timePref: res.timePref && res.timePref !== 'any' ? res.timePref : 'any' });
      setMsgs((m) => [...m, { role: 'assistant', text: (res.via === 'ai' && res.reply) || t(L, 'gotIt') }]);
    } else {
      setMsgs((m) => [...m, { role: 'assistant', text: (res.via === 'ai' && res.reply) || t(L, 'askMore') }]);
    }
  };
  const tLabel = (p) => t(L, p === 'morning' ? 'tMorning' : p === 'afternoon' ? 'tAfternoon' : 'tAny');

  return html`<div className="stack-lg" style=${{ flex: 1 }}>
    <${TopBar} onBack=${() => go({ name: 'home' })} right=${html`<button className="demo-pill" style=${{ textTransform: 'none', letterSpacing: 0, fontSize: '.85rem', display: 'flex', alignItems: 'center', gap: 6, color: 'var(--accent)', background: 'var(--tint)', borderColor: 'transparent' }} onClick=${() => go({ name: 'settings', focus: 'lang' })} aria-label=${'Language: ' + langInfo(L).english}><${Icon} name="globe" size=${16} />${langInfo(L).native}</button>`} />
    <div className="chat" aria-live="polite">
      ${msgs.map((m, i) => html`<div key=${i} className=${'bubble ' + (m.role === 'user' ? 'me' : 'ai') + (m.alert ? ' alert' : '')} lang=${L}>${m.text}</div>`)}
      ${msgs.length === 1 && !busy ? html`<div className="stack" style=${{ alignSelf: 'flex-end', alignItems: 'flex-end', maxWidth: '86%' }}>
        <span className="eyebrow">${t(L, 'tryExample')}</span>
        <button className="btn btn-secondary" style=${{ textAlign: 'left', height: 'auto', padding: '12px 14px', fontWeight: 500, lineHeight: 1.4 }} onClick=${() => send(t(L, 'exampleReq'))}>“${t(L, 'exampleReq')}”</button>
        <button className="btn btn-secondary" style=${{ textAlign: 'left', height: 'auto', padding: '12px 14px', fontWeight: 500, lineHeight: 1.4 }} onClick=${() => send(t(L, 'exampleWeekly'))}>“${t(L, 'exampleWeekly')}”</button>
      </div>` : null}
      ${wk ? html`<div className="confirm">
        <span className="eyebrow" style=${{ color: 'var(--accent)' }}>${t(L, 'weekly')}</span>
        <dl className="kv"><dt>${t(L, 'wkWhat')}</dt><dd>${wk.what || '—'}</dd><dt>${t(L, 'wkDay')}</dt><dd>${t(L, 'everyDay', { day: fmtWeekdayLong(wk.weekday, L) })}</dd><dt>${t(L, 'time')}</dt><dd>${fmtTime(seriesTimeIso(wk), L)} · ${t(L, 'minN', { n: wk.durationMin })}</dd>${wk.place ? html`<dt>${t(L, 'wkWhere')}</dt><dd>${wk.place}</dd>` : null}</dl>
        <p className="small muted">${t(L, 'wkNoBook')}</p>
        <div className="stack">
          <button className="btn btn-primary btn-block" onClick=${() => go({ name: 'weekly', prefill: wk })}>${t(L, 'setUpWeekly')}</button>
          <button className="btn btn-secondary btn-block" onClick=${() => { setWk(null); setMsgs((m) => [...m, { role: 'assistant', text: t(L, 'askChange') }]); }}>${t(L, 'changeIt')}</button>
        </div>
      </div>` : null}
      ${busy ? html`<div className="bubble ai"><div className="typing" aria-label=${t(L, 'thinking')}><i></i><i></i><i></i></div></div>` : null}
      ${draft ? html`<div className="confirm">
        <span className="eyebrow" style=${{ color: 'var(--accent)' }}>${t(L, 'checkTitle')}</span>
        <dl className="kv"><dt>${t(L, 'doctor')}</dt><dd>${draft.doctor}<div className="muted small" style=${{ fontWeight: 500 }}>${t(L, 'sp_' + draft.specialty)}</div></dd><dt>${t(L, 'reason')}</dt><dd>${draft.reason}</dd><dt>${t(L, 'time')}</dt><dd>${tLabel(draft.timePref)}</dd></dl>
        <b style=${{ fontSize: '1.1rem' }}>${t(L, 'isRight')}</b>
        <div className="tiles">
          <button className="btn btn-primary" onClick=${() => go({ name: 'call', draft })}>${t(L, 'yes')}</button>

        </div>
      </div>` : null}
      <div ref=${endRef}></div>
    </div>
    ${micMsg ? html`<p className="small muted center">${micMsg}</p>` : null}
    <form className="composer" onSubmit=${(e) => { e.preventDefault(); send(); }}>
      <button type="button" className=${'mic-sm' + (live ? ' live' : '')} aria-label=${t(L, 'speak')} aria-pressed=${live} onClick=${startMic}><${Icon} name="mic" size=${26} /></button>
      ${live && !text ? html`<div className="grow row"><div className="wave" aria-hidden="true">${[0, 1, 2, 3, 4, 5].map((i) => html`<i key=${i} style=${{ animationDelay: (i * 0.12) + 's' }}></i>`)}</div><b>${t(L, 'listening')}</b></div>`
        : html`<input id="cb-msg" className="input grow" value=${text} placeholder=${t(L, 'typeHere')} aria-label=${t(L, 'typeHere')} onInput=${(e) => setText(e.target.value)} lang=${L} />`}
      <button type="submit" className="icon-btn" style=${{ background: 'var(--bg)', color: 'var(--accent)' }} aria-label=${t(L, 'send')} disabled=${!text.trim() || busy}><${Icon} name="send" /></button>
    </form>
  </div>`;
}

function Call(props) {
  const { srv, st } = props;
  const real = srv && srv.features && srv.features.calls && st.settings.clinicPhone && !props.practice;
  return real ? html`<${RealCall} ...${props} />` : html`<${SimCall} ...${props} />`;
}

/* Saves the booked visit and asks the ride circle. Shared by the practice call and the real call. */
function saveBooking(update, draft, startIso, extra) {
  const id = uid('cb');
  update((n) => {
    const a = {
      id, source: 'carebridge', status: 'booked', start: startIso,
      doctor: draft.doctor, place: draft.place, specialty: draft.specialty, reason: draft.reason, reasonEn: draft.reasonEn,
      ride: { status: 'idle', driverId: null, askedId: null, declinedIds: [] }, delayMin: 0, followUp: null
    };
    Object.assign(a, extra || {});
    n.appts.push(a); n.appts.sort((x, y) => new Date(x.start) - new Date(y.start));
    if (n.people.length) askNext(n, a);
  });
  return id;
}

function BookedCard({ st, appt, go }) {

/* A real phone call through the server: Twilio dials, Claude talks, the transcript shows live. */
function RealCall({ st, update, go, draft, notify }) {
  const L = st.profile.lang;
  const [callId, setCallId] = useState(null);
  const [info, setInfo] = useState({ status: 'dialing', lines: [] });
  const [err, setErr] = useState('');
  const [bookedId, setBookedId] = useState(null);
  const pt = st.patient || {};
  useEffect(() => {
    let stop = false;
    api('call/start', { to: st.settings.clinicPhone, patientName: pt.fullName || st.profile.name, dob: pt.birthDate || '', mrn: pt.mrn || '', doctor: draft.doctor, clinic: draft.clinic, reasonEn: draft.reasonEn, timePref: draft.timePref, interpreter: L !== 'en' ? langInfo(L).english : '' })
      .then((j) => { if (!stop) setCallId(j.id); }).catch((e) => setErr(e.message));
    return () => { stop = true; };
  }, []);
  useEffect(() => {
    if (!callId || bookedId) return;
    let alive = true;
    const tick = async () => {
      try {
        const j = await api('call/status?id=' + encodeURIComponent(callId));
        if (!alive) return;
        setInfo(j);
        if (j.status === 'ended') {
          if (j.outcome === 'booked' && j.date) {
            const iso = new Date(j.date + 'T' + (j.time || '10:00') + ':00').toISOString();
            const id = saveBooking(update, draft, iso, { bookedBy: 'call' });
            setBookedId(id);
            notify(t(L, 'booked'), fmtDay(iso, L) + ' · ' + fmtTime(iso, L) + ' · ' + draft.doctor, { channel: 'Push' });
          }
          return;
        }
      } catch (e) { /* keep trying */ }
      if (alive) setTimeout(tick, 1500);
    };
    tick();
    return () => { alive = false; };
  }, [callId, bookedId]);
  const appt = bookedId && st.appts.find((a) => a.id === bookedId);
  const statusWord = { dialing: 'Calling…', ringing: 'Ringing…', 'in-progress': 'On call', ended: 'Call ended' }[info.status] || 'On call';
  return html`<div className="stack-lg" style=${{ flex: 1 }}>
    <div className="top"><span className="row small" style=${{ fontWeight: 650, color: 'var(--accent)', gap: 8 }}><span className="live-dot"></span>${statusWord}</span><span className="badge-demo">Live call · ${st.settings.clinicPhone}</span></div>
    <div className="stack"><h1 className="h1">${t(L, 'callTitle')}</h1><p className="sub">${t(L, 'callSub')}</p></div>
    ${err ? html`<div className="bubble alert" style=${{ maxWidth: '100%' }}>${err}</div><button className="btn btn-secondary btn-block" onClick=${() => go({ name: 'call', draft, practice: true })}>Use the practice call instead</button>` : null}
    <div className="transcript" aria-live="polite">
      ${info.lines.map((l, i) => html`<div key=${i} className=${'line' + (l.who === 'ai' ? ' ai' : '')}><span className="who">${l.who === 'ai' ? 'CareBridge (AI)' : (draft.clinic || 'Clinic')}</span><span>${l.text}</span></div>`)}
      ${info.status !== 'ended' && !err ? html`<div className="typing"><i></i><i></i><i></i></div>` : null}
    </div>
    ${info.status === 'ended' && !appt ? html`<div className="card stack"><b>${info.outcome === 'callback' ? 'The clinic needs a call back.' : 'The call ended without a booking.'}</b><span className="small muted">${info.outcome}</span>
      <div className="tiles"><button className="btn btn-primary btn-sm" onClick=${() => go({ name: 'call', draft, n: Date.now() })}>Try again</button><button className="btn btn-secondary btn-sm" onClick=${() => go({ name: 'home' })}>${t(L, 'goHome')}</button></div></div>` : null}
    ${appt ? html`<${BookedCard} st=${st} appt=${appt} go=${go} />` : null}
  </div>`;
}

function SimCall({ st, update, go, draft, notify }) {
  const L = st.profile.lang;
  const slot = useMemo(() => nextSlot(st, draft.timePref), []);
  const [shown, setShown] = useState(0);
  const [bookedId, setBookedId] = useState(null);
  const pt = st.patient || {};
  const fullName = pt.fullName || st.profile.name || 'the patient';
  const first = (st.profile.name || fullName).trim();
  const slotLong = new Intl.DateTimeFormat('en-US', { weekday: 'long', month: 'long', day: 'numeric' }).format(new Date(slot)) + ' at ' + new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit' }).format(new Date(slot));
  const pref = draft.timePref === 'morning' ? 'Mornings work best.' : draft.timePref === 'afternoon' ? 'Afternoons work best.' : 'Any time works.';
  const interp = L !== 'en' ? ' ' + first + ' will need a ' + langInfo(L).english + ' interpreter, please.' : '';
  const lines = [
    { who: draft.clinic || 'Clinic', ai: false, text: (draft.clinic || 'Clinic') + ', how can I help you?' },
    { who: 'CareBridge (AI)', ai: true, text: "Hi, I'm an AI assistant calling for " + fullName + (pt.birthDate ? ', date of birth ' + pt.birthDate : '') + (pt.mrn ? ', medical record number ' + pt.mrn : '') + '. ' + first + ' would like ' + draft.reasonEn + ' with ' + draft.doctor + '. ' + pref },
    { who: draft.clinic || 'Clinic', ai: false, text: 'Let me check. How about ' + slotLong + '?' },
    { who: 'CareBridge (AI)', ai: true, text: 'That works. Please book it.' + interp },
    { who: draft.clinic || 'Clinic', ai: false, text: "You're all set for " + slotLong + '.' + (interp ? ' Interpreter noted.' : '') + ' See you then.' }
  ];
  useEffect(() => {
    if (shown < lines.length) { const id = setTimeout(() => setShown((n) => n + 1), shown === 0 ? 700 : 1500); return () => clearTimeout(id); }
    if (!bookedId) {
      const id = saveBooking(update, draft, slot);
      setBookedId(id);
      notify(t(L, 'booked'), fmtDay(slot, L) + ' · ' + fmtTime(slot, L) + ' · ' + draft.doctor, { channel: 'Push' });
    }
  }, [shown]);
  const appt = bookedId && st.appts.find((a) => a.id === bookedId);
  return html`<div className="stack-lg" style=${{ flex: 1 }}>
    <div className="top"><span className="row small" style=${{ fontWeight: 650, color: 'var(--accent)', gap: 8 }}><span className="live-dot"></span>${bookedId ? 'Call ended' : 'On call'}</span><span className="badge-demo">Demo · simulated call</span></div>
    <div className="stack"><h1 className="h1">${t(L, 'callTitle')}</h1><p className="sub">${t(L, 'callSub')}</p></div>
    <div className="transcript" aria-live="polite">
      ${lines.slice(0, shown).map((l, i) => html`<div key=${i} className=${'line' + (l.ai ? ' ai' : '')}><span className="who">${l.who}</span><span>${l.text}</span></div>`)}
      ${shown < lines.length ? html`<div className="typing"><i></i><i></i><i></i></div>` : null}
    </div>
    ${appt ? html`<${BookedCard} st=${st} appt=${appt} go=${go} />` : null}
  </div>`;
}

/* =====================================================================
   VISIT (details, day of, delay, actions)
   ===================================================================== */
function Visit({ st, update, go, id, notify, saveFile }) {
  const L = st.profile.lang;
  const a = st.appts.find((x) => x.id === id);
  const [skipAsk, setSkipAsk] = useState(false);
  const [doneSent, setDoneSent] = useState(!!(a && a.doneAt));
  if (!a) return html`<div><${TopBar} onBack=${() => go({ name: 'home' })} /><p>Not found.</p></div>`;
  const r = rideLine(st, a);
  const rb = a.rideBack ? rideLine(st, a, 'back') : null;
  const rs = [r, rb].filter(Boolean);
  const today = sameDay(a.start, Date.now()) || st.demoToday === a.id;
  const driver = r && r.driver;
  const backDriver = rb && rb.driver;
  const summary = [fmtLongDay(a.start, L) + ', ' + fmtTime(visitTime(a), L) + '.', (a.seriesId ? a.reason : a.doctor) + (a.place ? ', ' + a.place : '') + '.', ...rs.map((x) => x.text + '.' + (x.sub ? ' ' + x.sub + '.' : '')), a.delayMin ? t(L, 'lateTitle', { n: a.delayMin }) + '.' : ''].join(' ');
  // Title and subtitle: "Physiotherapy / Every Thursday" for a weekly visit, the doctor for a normal one.
  let title = today ? t(L, 'today') + ' · ' + a.doctor : t(L, 'visitTitle');
  let subtitle = today ? '' : a.doctor + ' · ' + t(L, 'sp_' + (a.specialty || 'family'));
  if (a.seriesId) {
    title = (today ? t(L, 'today') + ' · ' : '') + a.reason;
    subtitle = t(L, 'everyDay', { day: fmtWeekdayLong(new Date(a.start).getDay(), L) });
  }
  const imDone = () => {
    setDoneSent(true);
    update((n) => { const x = n.appts.find((y) => y.id === a.id); if (x) x.doneAt = Date.now(); n.messages.unshift({ id: uid('m'), to: backDriver.id, from: 'senior', text: doneText(st, a), at: Date.now(), apptId: a.id }); });
    sendText(backDriver, doneText(st, a));
    notify(t(L, 'doneTitle', { name: backDriver.name }), t(L, 'doneBody', { name: backDriver.name }), { channel: 'Text to ' + backDriver.name });
  };
  const skip = () => {
    let told = [];
    update((n) => { told = skipWeek(n, a.id); ensureSeries(n); });
    setTimeout(() => { told.forEach((p) => sendText(p, skipText(st, a))); notify(t(L, 'skipWeek'), t(L, 'skippedMsg'), { channel: 'Push' }); }, 50);
    go({ name: 'home' });
  };
  const smsBody = driver ? 'CareBridge: ' + st.profile.name + ' — ' + a.doctor + ', ' + fmtDay(a.start, 'en') + ' ' + fmtTime(visitTime(a), 'en') + '. Pickup ' + fmtTime(pickupTime(a), 'en') + (a.place ? ' · ' + a.place : '') : '';
  return html`<div className="stack-lg">
    <${TopBar} onBack=${() => go({ name: 'home' })} />
    <div className="stack">
      <span className="eyebrow" style=${{ color: 'var(--accent)' }}>${fmtLongDay(a.start, L)}</span>
      <h1 className="h1">${title}</h1>
      ${subtitle ? html`<p className="sub">${subtitle}</p>` : null}
    </div>
    ${a.delayMin ? html`<div className="card-grad row" style=${{ alignItems: 'flex-start' }}>
      <span className="check" style=${{ width: 40, height: 40, borderRadius: 20 }}><${Icon} name="clock" /></span>
      <div className="stack" style=${{ gap: 4 }}><b className="h2" style=${{ color: '#fff', fontSize: '1.15rem' }}>${t(L, 'lateTitle', { n: a.delayMin })}</b>${driver ? html`<span>${t(L, 'lateBody', { name: driver.name, time: fmtTime(pickupTime(a), L) })}</span>` : null}</div>
    </div>` : null}
    <div className="card stack">
      <div className="tl">
        ${driver ? html`<div className="tl-item"><div className="tl-rail"><span className="tl-dot"></span><span className="tl-line"></span></div><div className="tl-body"><b>${fmtTime(pickupTime(a), L)} · ${r.text}</b></div></div>` : null}
        <div className="tl-item"><div className="tl-rail"><span className="tl-dot open"></span>${backDriver ? html`<span className="tl-line"></span>` : null}</div><div className="tl-body" style=${{ paddingBottom: backDriver ? undefined : 0 }}><b>${fmtTime(visitTime(a), L)}${a.seriesId ? '–' + fmtTime(endTime(a), L) + ' · ' + a.reason : ' · ' + a.doctor}</b><div className="muted small row" style=${{ gap: 6 }}><${Icon} name="pin" size=${15} />${a.place || '—'}</div>${L !== 'en' && !a.seriesId ? html`<div className="muted small">${langInfo(L).english} interpreter</div>` : null}</div></div>
        ${backDriver ? html`<div className="tl-item"><div className="tl-rail"><span className="tl-dot"></span></div><div className="tl-body" style=${{ paddingBottom: 0 }}><b>${fmtTime(endTime(a), L)} · ${rb.text}</b></div></div>` : null}
      </div>
      ${rs.filter((x) => x.kind === 'wait').map((x) => html`<div key=${'w' + x.leg} className="row"><span className="status wait">${x.text}</span>${x.asked ? html`<button className="link-btn small" onClick=${() => go({ name: 'family', id: x.asked.id })}>Demo: ${x.asked.name}'s phone</button>` : null}</div>`)}
      ${rs.filter((x) => x.kind === 'later').map((x) => html`<div key=${'l' + x.leg} className="row small muted"><${Icon} name="clock" size=${16} />${x.text}</div>`)}
      ${rs.filter((x) => x.kind === 'none').map((x) => html`<div key=${'n' + x.leg} className="stack"><span className="status wait">${x.text}</span><${OtherRides} st=${st} update=${update} a=${a} leg=${x.leg} /></div>`)}
      ${!r && st.people.length ? html`<button className="btn btn-soft btn-sm" onClick=${() => update((n) => restartAsking(n, a.id))}>${t(L, 'askAgain')}</button>` : null}
    </div>
    ${a.seriesId && a.phone ? html`<div className="card"><span className="muted small">${t(L, 'clinicPhone')}: <span style=${{ userSelect: 'all' }}>${a.phone}</span></span></div>` : null}
    ${a.seriesId ? null : html`<div className="card stack">
      <span className="eyebrow">${t(L, 'questions')}</span>
      <span>1. ${a.reason}</span><span>2. ${t(L, 'q1')}</span><span>3. ${t(L, 'q2')}</span>
      ${a.prep && a.prep.length ? html`<div className="divider"></div><span className="eyebrow">${t(L, 'prep')}</span>${a.prep.map((x, i) => html`<span key=${i} className="row small" style=${{ gap: 8 }}><${Icon} name="check" size=${16} />${x}</span>`)}` : null}
      ${a.phone ? html`<span className="muted small">${t(L, 'clinicPhone')}: <span style=${{ userSelect: 'all' }}>${a.phone}</span></span>` : null}
      <span className="muted small">${t(L, 'bring')}</span>
      ${st.patient && st.patient.meds && st.patient.meds.length ? html`<div className="chips">${st.patient.meds.map((m) => html`<span key=${m} className="tag">${m}</span>`)}</div>` : null}
    </div>`}
    ${a.seriesId && backDriver ? html`<button className="btn btn-primary btn-block" style=${{ minHeight: 72, fontSize: '1.15rem' }} disabled=${doneSent} onClick=${imDone}><${Icon} name="car" size=${26} />${doneSent ? t(L, 'doneTitle', { name: backDriver.name }) : t(L, 'imDone')}</button>` : null}
    <div className="stack">
      <button className=${'btn btn-block ' + (a.seriesId && backDriver ? 'btn-secondary' : 'btn-primary')} onClick=${() => speak(summary, L) || notify(t(L, 'readToMe'), summary, { preview: true })}><${Icon} name="speaker" />${t(L, 'readToMe')}</button>
      <button className="btn btn-secondary btn-block" onClick=${() => saveFile('carebridge-visit.ics', icsFor(st, a), 'text/calendar')}><${Icon} name="cal" />${t(L, 'addCal')}</button>
      ${driver ? html`<${TextDriver} st=${st} driver=${driver} body=${smsBody} />` : null}
      <button className="btn btn-soft btn-block" onClick=${() => go({ name: 'after', id: a.id })}><${Icon} name="check" />${t(L, 'visitDone')}</button>
      ${a.seriesId ? (!skipAsk ? html`<button className="btn btn-secondary btn-block" onClick=${() => setSkipAsk(true)}><${Icon} name="x" />${t(L, 'skipWeek')}</button>`
        : html`<div className="card stack"><b>${t(L, 'skipConfirm', { day: fmtDay(a.start, L) })}</b><div className="tiles"><button className="btn btn-primary" onClick=${skip}>${t(L, 'yes')}</button><button className="btn btn-secondary" onClick=${() => setSkipAsk(false)}>${t(L, 'cancel')}</button></div></div>`) : null}
      ${a.seriesId ? html`<button className="link-btn small" style=${{ alignSelf: 'center' }} onClick=${() => go({ name: 'weekly', id: a.seriesId })}>${t(L, 'weekly')} →</button>` : null}
    </div>
  </div>`;
}

function TextDriver({ st, driver, body }) {

function OtherRides({ st, update, a, leg }) {

/* =====================================================================
   AFTER THE VISIT
   ===================================================================== */
function After({ st, update, go, id, notify }) {
  const L = st.profile.lang;
  const a = st.appts.find((x) => x.id === id);
  const [fu, setFu] = useState(a && a.followUp ? a.followUp.choice : null);
  const [sent, setSent] = useState(false);
  useEffect(() => { if (a && a.status !== 'done') update((n) => { const x = n.appts.find((y) => y.id === id); if (x) { x.status = 'done'; if (n.demoToday === id) n.demoToday = null; } }); }, []);
  if (!a) return null;
  // Weekly visits can have two drivers (there and home); both get the thank-you.
  const drivers = Array.from(new Set(legsOf(a).map((l) => a[legKey(l)] && a[legKey(l)].driverId).filter(Boolean))).map((pid) => st.people.find((p) => p.id === pid)).filter(Boolean);
  const driver = drivers.length ? { id: drivers[0].id, name: drivers.map((d) => d.name).join(' & ') } : null;
  const choose = (c) => { setFu(c); update((n) => { const x = n.appts.find((y) => y.id === id); if (x) x.followUp = { choice: c, months: c === 'in3' ? 3 : null }; }); };
  const thank = () => {
    setSent(true);
    update((n) => { drivers.forEach((d) => n.messages.unshift({ id: uid('m'), to: d.id, from: 'senior', text: t(L, 'thankMsg'), at: Date.now(), apptId: id })); });
    notify(t(L, 'thankSent', { name: driver.name }), '“' + t(L, 'thankMsg') + '”');
    drivers.forEach((d) => sendText(d, 'CareBridge: ' + (st.profile.name || 'Your family member') + ' says: "' + t(L, 'thankMsg') + '"' + (L !== 'en' ? ' (' + STRINGS.en.thankMsg + ')' : '')));
  };
  return html`<div className="stack-lg">
    <${TopBar} onBack=${() => go({ name: 'home' })} />
    <h1 className="h1">${t(L, 'afterTitle')}</h1>
    ${a.seriesId ? null : html`<div className="stack">
      <span className="h2" style=${{ fontSize: '1.2rem' }}>${t(L, 'seeAgain')}</span>
      <button className="list-choice" aria-pressed=${fu === 'in3'} onClick=${() => choose('in3')}><span className="grow"><b>${t(L, 'in3')}</b></span><span className="radio">${fu === 'in3' ? html`<${Icon} name="check" size=${15} sw=${3} />` : null}</span></button>
